version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Budapest"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
    groups:
      runtime-deps:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      dev-tooling:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # 15 AST-scanning test files import `typescript`'s JS Compiler API, which TS 7.0 Go-native drops.
      - dependency-name: "typescript"
        versions:
          - ">= 7.0.0"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Budapest"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Budapest"
    open-pull-requests-limit: 5
    groups:
      actions-updates:
        patterns:
          - "*"
