# HOSTINGERDOCKER1107: the Marveen container image.
#   build:   every PR and push that touches the image builds it for linux/amd64 and linux/arm64 (no push), and
#            runs the offline smoke (docker/ci-smoke.sh) on the amd64 image.
#   publish: a release tag (v*) pushes ghcr.io/szotasz/marveen:<version> and :latest, ONLY when the repository
#            variable MARVEEN_PUBLISH_IMAGE is 'true' (off until the live VPS trial passed and the maintainer turns it on).
#            After the push it pulls the image it just published, by digest and WITHOUT a registry login (the way an
#            install pulls it), and runs the same offline smoke on it: a private package or a broken push fails here.
# DOCKERGUIDEBUILD1108 (S1): every action is pinned to a full commit SHA, the version in the comment. This workflow
# holds packages: write on the publish job, so a moved tag of a third-party action must not reach it.
name: Docker image

on:
  pull_request:
    paths: ['Dockerfile', '.dockerignore', 'docker/**', 'docker-compose.yml', 'package.json', 'package-lock.json', 'tsconfig.json', 'src/**', 'web/**', 'scripts/build-web-assets.mjs', 'scripts/write-built-commit.cjs', '.github/workflows/docker-image.yml']
  push:
    branches: [develop, main]
    paths: ['Dockerfile', '.dockerignore', 'docker/**', 'docker-compose.yml', 'package.json', 'package-lock.json', 'tsconfig.json', 'src/**', 'web/**', 'scripts/build-web-assets.mjs', 'scripts/write-built-commit.cjs', '.github/workflows/docker-image.yml']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build linux/amd64 + linux/arm64 (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: MARVEEN_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Load the amd64 image for the smoke
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          provenance: false
          tags: marveen:ci
          build-args: MARVEEN_COMMIT=${{ github.sha }}
          cache-from: type=gha
      - name: Offline smoke (amd64)
        run: bash docker/ci-smoke.sh marveen:ci
      - name: Scan container image for CVEs (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'marveen:ci'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && vars.MARVEEN_PUBLISH_IMAGE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/szotasz/marveen
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: MARVEEN_COMMIT=${{ github.sha }}
          cache-from: type=gha
      # DOCKERGUIDEBUILD1108 (N1): the published image, as an install gets it. Logged out on purpose: a package that
      # stayed private (the first push of a new ghcr package can be) answers "denied" here instead of on a customer VPS.
      - name: Pull the published image anonymously, by digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -eu
          case "$DIGEST" in sha256:*) ;; *) echo "no digest from the push step: '$DIGEST'"; exit 1;; esac
          docker logout ghcr.io
          docker pull "ghcr.io/szotasz/marveen@$DIGEST"
          echo "published: ghcr.io/szotasz/marveen@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Offline smoke on the published image (amd64)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: bash docker/ci-smoke.sh "ghcr.io/szotasz/marveen@$DIGEST"

  release:
    needs: [build, publish]
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Create GitHub Release for version tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping creation."
            exit 0
          fi
          NOTES_FILE="$(mktemp)"
          if [ -n "$DIGEST" ]; then
            printf 'Container image: `ghcr.io/szotasz/marveen:%s` (`ghcr.io/szotasz/marveen@%s`)\n\n' "$TAG" "$DIGEST" > "$NOTES_FILE"
            gh release create "$TAG" --verify-tag --generate-notes --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" --verify-tag --generate-notes
          fi
          rm -f "$NOTES_FILE"
